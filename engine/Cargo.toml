# Borrowed Time's own engine: Rapier physics, a wgpu renderer, original game systems (ragdolls, breakable buildings).
# Clean room: written from public documentation and physics; no code from other games.
[workspace]
resolver = "2"
members = ["crates/bt_engine", "crates/bt_demo"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
rapier3d = "=0.36.1"
wgpu = "=30.0.2"
glam = { version = "=0.33.12", features = ["bytemuck"] }   # the glam Rapier 0.36 uses (through glamx), so the types are the same
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.3"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 2   # physics and the renderer are too slow unoptimized, even in tests
