# Publishes the phone/web build (pwa/) to GitHub Pages: https://dumbolicker.github.io/The-comedown/
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Runs on pushes to main that touch pwa/, or by hand from the Actions tab.
name: Pages (web and phone build)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pwa/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pwa
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
