# Builds the Unity version of Borrowed Time on GitHub's cloud machines (GameCI).
# It needs three repository secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.
# See unity/README.md. Without them the build job is skipped with a notice, not failed.
name: Unity build

on:
  workflow_dispatch:
  push:
    branches: [main, claude/game-refinement-9ofmk8]
    paths: ['unity/**', '.github/workflows/unity-build.yml']

permissions:
  contents: read

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity build skipped::Add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets. Steps are in unity/README.md; with no computer of your own, use the codespace in .devcontainer/README.md."
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [WebGL, StandaloneWindows64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space for the Unity image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: unity/BorrowedTime/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('unity/BorrowedTime/Packages/manifest.json', 'unity/BorrowedTime/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/BorrowedTime
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: BorrowedTime
          buildMethod: BorrowedTime.EditorTools.CiBuild.Build
          allowDirtyBuild: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BorrowedTime-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: ${{ matrix.targetPlatform == 'WebGL' && 90 || 14 }}   # the web build stays on the Pages site
