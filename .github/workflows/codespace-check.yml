# Builds the codespace (.devcontainer/) on GitHub's machines the way Codespaces does, with the Dev Containers CLI, and
# checks it: the desktop in the browser, Unity Hub, Firefox, the sign-in link handlers, and the optional editor install.
# Screenshots are kept as the "codespace-screenshots" artifact. This repository is public, so the runs cost nothing.
name: Codespace check

on:
  workflow_dispatch:
  push:
    branches: [main, claude/game-refinement-9ofmk8]
    paths: ['.devcontainer/**', 'tests/codespace_check.sh', '.github/workflows/codespace-check.yml']

permissions:
  contents: read

concurrency:
  group: codespace-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEVCONTAINER_CLI: '@devcontainers/cli@0.90.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space for the Unity editor
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build and start the codespace's container (features, then setup.sh)
        run: npx --yes "$DEVCONTAINER_CLI" up --workspace-folder .

      - name: Desktop, Unity Hub, Firefox and link handlers
        run: npx --yes "$DEVCONTAINER_CLI" exec --workspace-folder . bash tests/codespace_check.sh

      - name: Optional Unity editor install
        continue-on-error: true
        run: npx --yes "$DEVCONTAINER_CLI" exec --workspace-folder . bash tests/codespace_check.sh editor

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: codespace-screenshots
          path: .ci-shots
          retention-days: 14
